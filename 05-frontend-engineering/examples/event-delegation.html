<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event delegation - todo list</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      form { display: flex; gap: 0.5rem; align-items: end; flex-wrap: wrap; }
      label { display: block; }
      input[type="text"] { padding: 0.4rem; min-width: 16rem; }
      button { padding: 0.4rem 0.8rem; }
      ul { list-style: none; padding: 0; }
      .todo-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.4rem 0; border-bottom: 1px solid #e5e7eb; }
      .todo-item.is-done .todo-title { text-decoration: line-through; color: #4b5563; }
      :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tasks</h1>
      <p>One <code>click</code> listener and one <code>change</code> listener on the list handle every task, including tasks added later. Try adding a task that contains HTML, like <code>&lt;img src=x onerror=alert(1)&gt;</code>: it is shown as text.</p>

      <form id="todo-form">
        <div>
          <label for="todo-title">New task</label>
          <input id="todo-title" name="title" type="text" required maxlength="120" autocomplete="off" />
        </div>
        <button type="submit">Add</button>
      </form>

      <h2>Your tasks</h2>
      <ul id="todo-list" aria-label="Tasks"></ul>
      <p id="todo-status" role="status" class="visually-hidden"></p>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input type="checkbox" data-action="toggle" />
          <span class="todo-title"></span>
        </label>
        <button type="button" data-action="delete">Delete</button>
      </li>
    </template>

    <script>
      const form = document.getElementById("todo-form");
      const titleInput = document.getElementById("todo-title");
      const list = document.getElementById("todo-list");
      const status = document.getElementById("todo-status");
      const template = document.getElementById("todo-item-template");

      let todos = [
        { id: 1, title: "Write the release notes", done: false },
        { id: 2, title: "Review the checkout pull request", done: true },
      ];
      let nextId = 3;

      function render() {
        const items = todos.map((todo) => {
          const item = template.content.firstElementChild.cloneNode(true);
          item.dataset.id = String(todo.id);
          item.classList.toggle("is-done", todo.done);
          item.querySelector(".todo-title").textContent = todo.title; // safe: text only
          item.querySelector('[data-action="toggle"]').checked = todo.done;
          item.querySelector('[data-action="delete"]').setAttribute("aria-label", `Delete ${todo.title}`);
          return item;
        });
        list.replaceChildren(...items);
      }

      function announce(message) {
        status.textContent = message;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) return;
        todos = [...todos, { id: nextId++, title, done: false }];
        render();
        form.reset();
        titleInput.focus();
        announce(`Added "${title}". ${todos.length} tasks.`);
      });

      // Delegated: one listener for every checkbox, now and in the future
      list.addEventListener("change", (event) => {
        const checkbox = event.target.closest('input[data-action="toggle"]');
        if (!checkbox || !list.contains(checkbox)) return;
        const id = Number(checkbox.closest("li").dataset.id);
        todos = todos.map((todo) => (todo.id === id ? { ...todo, done: checkbox.checked } : todo));
        render();
        list.querySelector(`li[data-id="${id}"] input`).focus();
      });

      // Delegated: one listener for every delete button
      list.addEventListener("click", (event) => {
        const button = event.target.closest('button[data-action="delete"]');
        if (!button || !list.contains(button)) return;
        const id = Number(button.closest("li").dataset.id);
        const removed = todos.find((todo) => todo.id === id);
        todos = todos.filter((todo) => todo.id !== id);
        render();
        titleInput.focus();
        announce(`Deleted "${removed.title}". ${todos.length} tasks left.`);
      });

      render();
    </script>
  </body>
</html>
